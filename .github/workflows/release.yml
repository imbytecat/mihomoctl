name: Release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing vMAJOR.MINOR.PATCH tag to verify and publish
        required: true
        type: string
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false
jobs:
  release:
    if: startsWith(github.ref, 'refs/tags/v') || startsWith(inputs.tag, 'v')
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mise.toml', 'go.sum') }}
      - run: just check
      - name: Verify real systemd lifecycle on the isolated runner
        run: just test-systemd
        env:
          MIHOMOCTL_SYSTEMD_TEST: '1'
      - run: just browser-install
      - run: just test-ui
      - name: Upload browser failure evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-failure-evidence
          path: ui/test-results/
          if-no-files-found: ignore
          retention-days: 7
      - name: Build and publish with GoReleaser
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: goreleaser release --clean
      - name: Verify public assets against this build
        run: |
          verify_dir=$(mktemp -d)
          trap 'rm -rf "$verify_dir"' EXIT
          release_url="https://github.com/imbytecat/mihomoctl/releases/download/$RELEASE_TAG"
          curl --fail --silent --show-error --location --retry 3 "$release_url/SHA256SUMS" -o "$verify_dir/SHA256SUMS"
          cmp "$verify_dir/SHA256SUMS" .release/SHA256SUMS
          while read -r _digest name; do
            curl --fail --silent --show-error --location --retry 3 "$release_url/$name" -o "$verify_dir/$name"
          done < .release/SHA256SUMS
          cd "$verify_dir"
          sha256sum -c SHA256SUMS
